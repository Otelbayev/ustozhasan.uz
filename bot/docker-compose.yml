# Local development uchun Postgres.
# Ishga tushirish:  npm run db:up      To'xtatish:  npm run db:down
#
# Postgres allaqachon o'rnatilgan bo'lsa bu fayl kerak emas — .env dagi
# DATABASE_URL ni o'z bazangizga yo'naltiring.

services:
  db:
    image: postgres:16-alpine
    container_name: ustoz-hasan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ustoz
      POSTGRES_PASSWORD: ustoz
      POSTGRES_DB: ustoz
    # 5433 — mahalliy Postgres (5432) bilan to'qnashmasligi uchun
    ports:
      - "5433:5432"
    volumes:
      - ustoz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustoz -d ustoz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ustoz_pgdata:
